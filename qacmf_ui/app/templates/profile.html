{% extends "base.html" %}

{% block content %}
    <h2>User Profile</h2>
    <p><strong>Username:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    
    <h3>Roles:</h3>
    {% if user.roles %}
        <ul>
            {% for role in user.roles %}
                <li>{{ role.name }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No roles assigned.</p>
    {% endif %}
    
    <!-- Add more profile information or actions here -->
{% endblock %}
